name: Release

on:
    push:
        tags:
            - "v*"
    # For backfilling a platform onto a tag that already released, e.g. after adding a
    # target to binaries.yml. GitHub release uploads are additive, so this only fills in what
    # `tag` is missing.
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to backfill (e.g. v0.9.0)
                required: true

# The default for every job. This fork publishes nothing to crates.io or PyPI: the upstream
# `publish` and `publish-pypi` jobs are removed (nkcolor, 2026-11-09). A tag builds the
# binaries and wheels and attaches them to the GitHub release only.
permissions:
    contents: write

jobs:
    build:
        name: Build
        permissions:
            contents: write
        uses: ./.github/workflows/binaries.yml
        with:
            tag: ${{ inputs.tag || github.ref_name }}

    # The binaries take their name from the tag and their version from Cargo.toml, so a
    # mistyped tag would otherwise ship one labelled as the other. This mattered more with
    # wheels attached, where a published version can never be reused, so keep it in mind when
    # those come back.
    version:
        name: Tag matches Cargo.toml
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Compare
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
                  tag=${RELEASE_TAG#v}
                  echo "Cargo.toml says $crate, tag says $tag"
                  if [ "$crate" != "$tag" ]; then
                    echo "::error::tag $RELEASE_TAG does not match Cargo.toml version $crate"
                    exit 1
                  fi

    # One abi3 wheel per platform: the floor Cargo.toml pins covers every
    # interpreter after it, so there is no per-Python-version matrix here.
    # Linux targets glibc rather than `build`'s musl, since manylinux is what
    # a wheel needs to be installable, not what makes a binary need no libc at all
    wheels:
        name: Wheel for ${{ matrix.target }}
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      manylinux: auto
                    - runner: windows-latest
                      target: x86_64-pc-windows-msvc
                    - runner: macos-14
                      target: aarch64-apple-darwin
                    - runner: macos-14
                      target: x86_64-apple-darwin
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build wheel
              uses: PyO3/maturin-action@v1
              with:
                  target: ${{ matrix.target }}
                  args: --release --out dist
                  manylinux: ${{ matrix.manylinux || 'auto' }}

            - name: Upload wheel
              uses: actions/upload-artifact@v4
              with:
                  name: wheel-${{ matrix.target }}
                  path: dist

    sdist:
        name: Source distribution
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  args: --out dist

            - name: Upload sdist
              uses: actions/upload-artifact@v4
              with:
                  name: wheel-sdist
                  path: dist

    attach-wheels:
        name: Attach wheels to the release
        needs: [version, wheels, sdist]
        runs-on: ubuntu-latest
        steps:
            - name: Collect every wheel and the sdist
              uses: actions/download-artifact@v4
              with:
                  pattern: wheel-*
                  path: dist
                  merge-multiple: true

            - name: Upload to release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag || github.ref_name }}
                  files: dist/*
